name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      collect:
        description: "Também rodar a coleta de teste (workflow Coleta) com as fontes públicas"
        type: boolean
        default: false
      per_query_limit:
        description: "Coleta: máximo de itens por consulta"
        type: string
        default: "10"

jobs:
  test:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,analysis]"

      - name: Run Ruff linter
        run: |
          ruff check src/ tests/

      - name: Check formatting (ruff format)
        run: |
          ruff format --check src/ tests/

      - name: Type check (mypy strict)
        run: |
          mypy src/

      - name: Run Pytest test suite with coverage
        run: |
          pytest --cov=src/msrkit --cov-report=term-missing tests/

      - name: Validate sample protocol
        run: |
          python -m msrkit.cli validate protocols/v0_rag_agents_testing.yaml

      - name: Verify collection planning (dry-run)
        run: |
          python -m msrkit.cli plan protocols/v0_rag_agents_testing.yaml

  collect:
    name: Coleta de teste
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.collect }}
    uses: ./.github/workflows/collect.yml
    with:
      per_query_limit: ${{ inputs.per_query_limit }}
    secrets: inherit
