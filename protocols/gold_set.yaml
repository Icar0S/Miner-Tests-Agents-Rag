# ==========================================================================
# Gold set de validação do minerador — Protocolo E2 v2, §10.3 (instrumento V1)
# ==========================================================================
# ~50 artefatos conhecidos de literatura cinza sobre teste de RAG e agentes,
# curados MANUALMENTE e ANTES da coleta. Serve para medir o recall do minerador:
# `msrkit recall protocols/gold_set.yaml --all`.
#
# Campos:
# - url: repositório (github.com/owner/repo — qualquer item dele conta) ou URL
#   exata de um post, thread, artigo, card.
# - tools: ferramentas do gazetteer (ids) que o artefato comprovadamente usa;
#   mede também o recall do extrator.
# - note: por que o artefato está no gold set e estrato que representa.
# ==========================================================================
version: "1"

entries:
  # ---- 1. Ferramentas e Frameworks Principais de Avaliação RAG ----
  - url: https://github.com/explodinggradients/ragas
    tools: [ragas]
