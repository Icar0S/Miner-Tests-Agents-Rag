# ==========================================================================
# MSR-Kit Protocol: v0 RAG & Agents Testing
# ==========================================================================
# Este é o arquivo de protocolo que o pesquisador edita para definir
# o escopo da coleta. Mantenha comentários claros — este é o contrato
# entre o pesquisador e a ferramenta.
# ==========================================================================

version: 0
name: v0_rag_agents_testing
description: >
  Coleta exploratória sobre ferramentas e métodos de teste para sistemas
  LLM com RAG e sistemas baseados em agentes.

# ---- Recorte temporal (§7.5) ----
# 01/01/2023 até o data-cutoff: RAG como prática de engenharia e frameworks de
# agentes se consolidam depois de dez/2022. O cutoff é o último dia do mês anterior
# à coleta, fixo, para que re-execuções vejam a mesma janela.
# Sobreposto por MSRKIT_WINDOW_SINCE / MSRKIT_WINDOW_UNTIL no .env.
window:
  since: "2023-01-01"
  until: "2026-08-31"

# ---- Léxico de busca (§7.1, léxico controlado duplo) ----
# Cada termo combina o sistema (RAG, LLM, agente) com teste/avaliação e cobre os
# dois vocabulários: o de prática (eval, judge, golden dataset, red teaming,
# trajectory) e o acadêmico (metamorphic testing, test oracle), para medir H1.
# Nomes de ferramenta ficam no gazetteer, não aqui (passe de descoberta, §7.6).
# Sobreposto por MSRKIT_TERMS no .env (termos separados por ";").
terms:
  # RAG
  - "RAG evaluation"
  - "RAG testing"
  - "retrieval augmented generation evaluation"
  # LLM em geral: oráculo, conjunto de referência, regressão, falhas
  - "LLM evaluation"
  - "LLM testing"
  - "LLM as a judge"
  - "eval harness"
  - "golden dataset"
  - "hallucination detection"
  - "prompt regression"
  - "red teaming LLM"
  - "guardrails evaluation"
  # Vocabulário acadêmico (H1)
  - "metamorphic testing LLM"
  - "LLM test oracle"
  # Agentes
  - "agent evaluation"
  - "agent testing"
  - "agentic evaluation"
  - "trajectory evaluation"
  - "tool calling evaluation"
  - "multi-agent testing"

# ---- Léxico em português (estrato exploratório, critério I4) ----
# Buscado junto com `terms`; cada ocorrência registra o idioma do termo
# (campo `lang` em matched_terms e coluna matched_languages no CSV).
# Sobreposto por MSRKIT_TERMS_PT no .env.
terms_by_language:
  pt:
    - "teste de RAG"
    - "avaliação de RAG"
    - "teste de LLM"
    - "avaliação de LLM"
    - "LLM como juiz"
    - "teste de agentes"
    - "avaliação de agentes"
    - "dataset de referência"
    - "teste de alucinação"
    - "regressão de prompt"

# ---- Grupos de conceito (§3.1, RQ5) ----
# Cada item recebe os conceitos cujo léxico casou. Rótulo de sistema do E2:
# conceitos ∩ {rag, agente}; híbrido recebe os dois. É pré-rotulagem automática;
# a codificação manual (Anexo A) é a referência.
concepts:
  rag:
    - "RAG"
    - "retrieval augmented"
    - "retriever"
    - "reranker"
    - "vector store"
    - "vector database"
    - "chunking"
    - "knowledge base"
    - "geração aumentada por recuperação"
  agente:
    - "agent"
    - "agentic"
    - "multi-agent"
    - "tool calling"
    - "function calling"
    - "tool use"
    - "agente"
  teste:
    - "test"
    - "eval"
    - "evaluation"
    - "benchmark"
    - "assertion"
    - "oracle"
    - "judge"
    - "red teaming"
    - "guardrail"
    - "teste"
    - "avaliação"

# ---- Gazetteer (§7.2) ----
# Ferramentas e métodos conhecidos; caminho relativo a este arquivo.
gazetteer: gazetteer.yaml

# ---- Critérios de elegibilidade (§8) para as planilhas de triagem ----
screening:
  batch_size: 25
  inclusion:
    I1: "Trata de teste, avaliação com veredito, verificação ou validação de sistema RAG ou agêntico"
    I2: "Publicado ou com última atividade dentro da janela temporal"
    I3: "Conteúdo público, acessível sem autenticação de terceiro"
    I4: "Inglês ou português"
    I5: "Artefato de código com elemento de teste identificável"
  exclusion:
    E1: "Usa LLM como ferramenta para testar outro software"
    E2: "Trata apenas do modelo isolado, sem recuperação nem ação"
    E3: "Conteúdo promocional sem detalhe técnico verificável"
    E4: "Duplicata ou espelho"
    E5: "Tutorial genérico sem critério de aprovação, oráculo ou modo de falha"
    E6: "Repositório-exemplo sem sinais de manutenção (quando o objetivo é N3)"

# ---- Formulário de extração (Anexo A) e qualidade da literatura cinza (§9) ----
# Campos da planilha de codificação (msrkit coding export/import).
# Tipos: enum (um valor) · multi (vários, separados por vírgula) · text · bool.
# vocabulary: tools/methods (gazetteer) ou failure_modes (catálogo abaixo).
# prefill: coluna auto_* copiada para o campo só com --prefill.
coding:
  # §15: dupla codificação independente em ≥20% dos elegíveis; κ por dimensão.
  double_coding_rate: 0.2
  agreement: [sistema, nivel_evidencia, modos_falha, tipo_oraculo]
  failure_modes:
    FP1: "Conteúdo ausente na base"
    FP2: "Documento relevante fora do top-k"
    FP3: "Documento recuperado fora do contexto consolidado"
    FP4: "Resposta não extraída do contexto"
    FP5: "Formato incorreto"
    FP6: "Especificidade incorreta"
    FP7: "Resposta incompleta"
    FP8: "Injeção indireta via documento recuperado"
    FP9: "Envenenamento de corpus"
    FP10: "Vazamento entre inquilinos"
    FP11: "Falha de custo, latência ou energia"
    FP12: "Deriva temporal do índice"
    FP13: "Falha de fluxo de controle adaptativo"
    AF1: "Seleção incorreta de ferramenta"
    AF2: "Argumentos inválidos ou ferramenta inexistente"
    AF3: "Falha de planejamento ou decomposição"
    AF4: "Não-terminação ou laço"
    AF5: "Efeito colateral indesejado ou irreversível"
    AF6: "Corrupção de estado ou memória entre passos"
    AF7: "Divergência trajetória × resultado"
    AF8: "Escalação de privilégio ou violação de escopo"
    AF9: "Estouro de custo, latência ou orçamento de passos"
    AF10: "Falha na recuperação de erro"
    AF11: "Injeção indireta via saída de ferramenta ou documento"
    AF12: "Falha de coordenação multiagente"
  fields:
    # Anexo A
    - {name: sistema, type: multi, values: [rag, agente], required: true, prefill: auto_sistema}
    - {name: nivel_evidencia, type: enum, values: [N1, N2, N3], required: true, prefill: auto_nivel}
    - {name: nivel_lg, type: enum, values: ["1", "2", "3"], help: "controle de saída (§9); vazio para artefatos de código"}
    - {name: ferramentas, type: multi, vocabulary: tools, prefill: auto_ferramentas}
    - {name: metodos, type: multi, vocabulary: methods, prefill: auto_metodos}
    - {name: modos_falha, type: multi, vocabulary: failure_modes}
    - {name: tipo_oraculo, type: enum, values: [especificado, derivado, referencia, pseudo-automatico, humano]}
    - {name: agregacao, type: enum, values: [atomico, agregado, nao-identificado]}
    - {name: evidencia_textual, type: text, required: true, max_length: 300, prefill: auto_evidencia}
    - {name: criterio_aprovacao_declarado, type: text}
    - {name: modo_falha_relatado, type: text, help: "aberto, para a codificação indutiva (§5.2)"}
    - {name: declara_o_que_nao_cobre, type: bool}
    - {name: confianca, type: enum, values: [alta, media, baixa], required: true}
    # §9 — fontes discursivas (Garousi, Felderer & Mäntylä, 2019)
    - {name: q_autoridade, type: bool, help: "autor identificável; vínculo institucional ou repositório"}
    - {name: q_metodologia, type: bool, help: "declara como chegou às conclusões"}
    - {name: q_objetividade, type: enum, values: [sem-vinculo, vinculo-declarado, vinculo-detectado]}
    - {name: q_data, type: bool, help: "dentro da janela; última atualização registrada"}
    - {name: q_novidade, type: bool, help: "acrescenta ferramenta, método ou modo de falha não catalogado"}
    - {name: q_impacto, type: enum, values: [alto, medio, baixo], help: "ver auto_engajamento"}
    # §9 — artefatos de código
    - {name: q_doc_teste, type: bool, help: "documenta o procedimento de teste; ver auto_manutencao"}

# Idiomas alvo
languages:
  - en
  - pt

# ---- Fontes ----
# Cada fonte pode ser habilitada/desabilitada independentemente.
# O campo 'extra' contém filtros específicos da fonte.
sources:
  github:
    enabled: true
    kinds:
      - repo
      - code
      - issue
    extra:
      languages:
        - Python
        - TypeScript
      min_stars: 3
    # Consultas literais da §7.3 do Protocolo E2 v2, na sintaxe de busca do GitHub.
    # Rodam além dos termos. `evidence` indica o nível de evidência que a consulta
    # busca (N2: uso declarado; N3: invocação em CI).
    queries:
      - kind: repo
        label: repos-rag
        q: '("RAG" OR "retrieval augmented") (eval OR test OR testing) in:name,description,readme stars:>5'
      - kind: repo
        label: repos-agentes
        q: '("agent" OR "agentic") (eval OR test OR testing) in:name,description,readme stars:>5'
      - {kind: code, label: ragas-import, evidence: N2, q: '"from ragas import" language:Python'}
      - {kind: code, label: deepeval-import, evidence: N2, q: '"import deepeval" language:Python'}
      - {kind: code, label: promptfoo-config, evidence: N2, q: 'filename:promptfooconfig.yaml'}
      - {kind: code, label: rag-metricas-teste, evidence: N2, q: '"faithfulness" "context_recall" language:Python path:tests'}
      - {kind: code, label: golden-dataset, evidence: N2, q: '"golden" "dataset" path:evals'}
      - {kind: code, label: tool-call-assert, evidence: N2, q: '"tool_call" "assert" language:Python path:tests'}
      # Templates: {anchor} e {repo} expandem sobre as âncoras do gazetteer.
      - {kind: code, label: ci, evidence: N3, q: '{anchor} path:.github/workflows language:YAML'}
      - {kind: issue, label: issues-ancora, q: 'repo:{repo} is:issue label:bug'}

  stackexchange:
    enabled: true
    extra:
      sites:
        - stackoverflow
        - softwareengineering
        - sqa
        - datascience
        - ai
        - pt.stackoverflow   # estrato em português
      # `tagged` tem semântica OU na API (/search/advanced: "at least one will
      # be present"). Cada termo é buscado com a lista completa de tags (ADR-017).
      tagged:
        - langchain
        - llamaindex
        - large-language-model
        - rag
        - openai-api

  hackernews:
    enabled: true

  devto:
    enabled: true
    extra:
      tags:
        - rag
        - llm
        - ai
        - agents
        - llmops
        - testing

  reddit:
    # Desabilitado no Estudo E2: credenciais novas exigem aprovação manual
    # prévia do Reddit desde nov/2025 (ADR-014, docs/sources.md).
    enabled: false
    extra:
      subreddits:
        - LocalLLaMA
        - LangChain
        - LLMDevs
        - AI_Agents
        - MachineLearning
        - softwaretesting
        - QualityAssurance

  huggingface:
    enabled: true
    extra:
      kinds:
        - models
        - datasets
        - spaces

  rss:
    enabled: true
    extra:
      feeds:
        - "https://medium.com/feed/tag/rag"
        - "https://medium.com/feed/tag/llm-evaluation"
        - "https://medium.com/feed/tag/ai-agents"
        - "https://medium.com/feed/tag/llmops"
        - "https://blog.langchain.dev/rss/"
        - "https://towardsdatascience.com/feed"
        - "https://arize.com/feed/"
      note: "RSS entrega apenas itens recentes; sem cobertura histórica."

  bluesky:
    # Coletada quando BLUESKY_HANDLE e BLUESKY_APP_PASSWORD estiverem no .env;
    # sem credencial, a execução pula a fonte e registra o motivo.
    enabled: true

  x_twitter:
    enabled: false  # requer plano pago

  discord:
    enabled: false  # requer bot instalado e autorização dos admins

  linkedin:
    enabled: false  # não suportado, permanentemente

# ---- Limites globais ----
limits:
  max_items_per_source: 5000
  max_requests_per_source: 2000
  stop_on_quota_exhausted: true
