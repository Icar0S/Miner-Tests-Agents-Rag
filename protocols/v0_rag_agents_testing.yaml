# ==========================================================================
# MSR-Kit Protocol: v0 RAG & Agents Testing
# ==========================================================================
# Este é o arquivo de protocolo que o pesquisador edita para definir
# o escopo da coleta. Mantenha comentários claros — este é o contrato
# entre o pesquisador e a ferramenta.
# ==========================================================================

version: 0
name: v0_rag_agents_testing
description: >
  Coleta exploratória sobre ferramentas e métodos de teste para sistemas
  LLM com RAG e sistemas baseados em agentes.

# ---- Recorte temporal (EDITAR) ----
# Define a janela de tempo para a busca.
# Formato: YYYY-MM-DD
window:
  since: "2023-01-01"
  until: "2026-08-31"

# ---- Termos de busca (EDITAR) ----
# v0 usa termos simples e amplos, de propósito. Serão refinados depois.
# Cada termo é buscado como frase exata ou palavras combinadas,
# dependendo da fonte.
terms:
  - "RAG testing"
  - "RAG evaluation"
  - "test RAG"
  - "evaluate RAG"
  - "LLM testing"
  - "LLM evaluation"
  - "LLM as a judge"
  - "agent testing"
  - "agent evaluation"
  - "agentic evaluation"
  - "golden dataset"
  - "hallucination test"
  - "prompt regression"
  - "eval harness"

# ---- Léxico em português (estrato exploratório, critério I4) ----
# Buscado junto com `terms`; cada ocorrência registra o idioma do termo
# (campo `lang` em matched_terms e coluna matched_languages no CSV).
terms_by_language:
  pt:
    - "teste de RAG"
    - "avaliação de RAG"
    - "teste de LLM"
    - "avaliação de LLM"
    - "LLM como juiz"
    - "teste de agentes"
    - "avaliação de agentes"
    - "dataset de referência"
    - "teste de alucinação"
    - "regressão de prompt"

# ---- Grupos de conceito (§3.1, RQ5) ----
# Cada item recebe os conceitos cujo léxico casou. Rótulo de sistema do E2:
# conceitos ∩ {rag, agente}; híbrido recebe os dois. É pré-rotulagem automática;
# a codificação manual (Anexo A) é a referência.
concepts:
  rag:
    - "RAG"
    - "retrieval augmented"
    - "retriever"
    - "reranker"
    - "vector store"
    - "vector database"
    - "chunking"
    - "knowledge base"
    - "geração aumentada por recuperação"
  agente:
    - "agent"
    - "agentic"
    - "multi-agent"
    - "tool calling"
    - "function calling"
    - "tool use"
    - "agente"
  teste:
    - "test"
    - "eval"
    - "evaluation"
    - "benchmark"
    - "assertion"
    - "oracle"
    - "judge"
    - "red teaming"
    - "guardrail"
    - "teste"
    - "avaliação"

# ---- Gazetteer (§7.2) ----
# Ferramentas e métodos conhecidos; caminho relativo a este arquivo.
gazetteer: gazetteer.yaml

# Idiomas alvo
languages:
  - en
  - pt

# ---- Fontes ----
# Cada fonte pode ser habilitada/desabilitada independentemente.
# O campo 'extra' contém filtros específicos da fonte.
sources:
  github:
    enabled: true
    kinds:
      - repo
      - code
      - issue
    extra:
      languages:
        - Python
        - TypeScript
      min_stars: 3
    # Consultas literais da §7.3 do Protocolo E2 v2, na sintaxe de busca do GitHub.
    # Rodam além dos termos. `evidence` indica o nível de evidência que a consulta
    # busca (N2: uso declarado; N3: invocação em CI).
    queries:
      - kind: repo
        label: repos-rag
        q: '("RAG" OR "retrieval augmented") (eval OR test OR testing) in:name,description,readme stars:>5'
      - kind: repo
        label: repos-agentes
        q: '("agent" OR "agentic") (eval OR test OR testing) in:name,description,readme stars:>5'
      - {kind: code, label: ragas-import, evidence: N2, q: '"from ragas import" language:Python'}
      - {kind: code, label: deepeval-import, evidence: N2, q: '"import deepeval" language:Python'}
      - {kind: code, label: promptfoo-config, evidence: N2, q: 'filename:promptfooconfig.yaml'}
      - {kind: code, label: rag-metricas-teste, evidence: N2, q: '"faithfulness" "context_recall" language:Python path:tests'}
      - {kind: code, label: golden-dataset, evidence: N2, q: '"golden" "dataset" path:evals'}
      - {kind: code, label: tool-call-assert, evidence: N2, q: '"tool_call" "assert" language:Python path:tests'}
      # Templates: {anchor} e {repo} expandem sobre as âncoras do gazetteer.
      - {kind: code, label: ci, evidence: N3, q: '{anchor} path:.github/workflows language:YAML'}
      - {kind: issue, label: issues-ancora, q: 'repo:{repo} is:issue label:bug'}

  stackexchange:
    enabled: true
    extra:
      sites:
        - stackoverflow
        - softwareengineering
        - sqa
        - datascience
        - ai
        - pt.stackoverflow   # estrato em português
      # `tagged` tem semântica OU na API (/search/advanced: "at least one will
      # be present"). Cada termo é buscado com a lista completa de tags (ADR-017).
      tagged:
        - langchain
        - llamaindex
        - large-language-model
        - rag
        - openai-api

  hackernews:
    enabled: true

  devto:
    enabled: true
    extra:
      tags:
        - rag
        - llm
        - ai
        - agents
        - llmops
        - testing

  reddit:
    # Desabilitado no Estudo E2: credenciais novas exigem aprovação manual
    # prévia do Reddit desde nov/2025 (ADR-014, docs/sources.md).
    enabled: false
    extra:
      subreddits:
        - LocalLLaMA
        - LangChain
        - LLMDevs
        - AI_Agents
        - MachineLearning
        - softwaretesting
        - QualityAssurance

  huggingface:
    enabled: true
    extra:
      kinds:
        - models
        - datasets
        - spaces

  rss:
    enabled: true
    extra:
      feeds:
        - "https://medium.com/feed/tag/rag"
        - "https://medium.com/feed/tag/llm-evaluation"
        - "https://medium.com/feed/tag/ai-agents"
        - "https://medium.com/feed/tag/llmops"
        - "https://blog.langchain.dev/rss/"
        - "https://towardsdatascience.com/feed"
        - "https://arize.com/feed/"
      note: "RSS entrega apenas itens recentes; sem cobertura histórica."

  bluesky:
    enabled: false  # habilitar após configurar credenciais

  x_twitter:
    enabled: false  # requer plano pago

  discord:
    enabled: false  # requer bot instalado e autorização dos admins

  linkedin:
    enabled: false  # não suportado, permanentemente

# ---- Limites globais ----
limits:
  max_items_per_source: 5000
  max_requests_per_source: 2000
  stop_on_quota_exhausted: true
