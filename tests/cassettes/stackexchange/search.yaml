        rel=\"nofollow noreferrer\">https://github.com/Azure/azure-sdk-for-python/blob/main/sdk/evaluation/azure-ai-evaluation/azure/ai/evaluation/_evaluators/_common/_base_prompty_eval.py#L83</a></p>\n"},{"owner":{"account_id":32600107,"reputation":1036,"user_id":25332792,"user_type":"registered","profile_image":"https://www.gravatar.com/avatar/333face9c22bb9bb9ec8208bdfdeca29?s=256&d=identicon&r=PG&f=y&so-version=2","display_name":"Qian
        Zhang","link":"https://stackoverflow.com/users/25332792/qian-zhang"},"is_accepted":false,"score":0,"last_activity_date":1741250351,"last_edit_date":1741250351,"creation_date":1741249889,"answer_id":79488691,"question_id":79488543,"content_license":"CC
        BY-SA 4.0","body":"<p>Instruction and chat history are part of your LLM''s
        prompt engineering strategy, and they aren''t actually &quot;retrieved contexts&quot;.
        They should be handled separately in your actual QA pipeline, but not included
        in the Ragas evaluation of retrieval quality.</p>\n<p>You should only use
        the retrieved content in the <code>retrieved_contexts</code> parameter, not
        the instruction+retrieved content+chat history.</p>\n<p>Please check the Ragas
        documentation and examples at <a href=\"https://docs.ragas.io/en/stable/concepts/metrics/available_metrics/context_recall/#llm-based-context-recall\"
        rel=\"nofollow noreferrer\">https://docs.ragas.io/en/stable/concepts/metrics/available_metrics/context_recall/#llm-based-context-recall</a></p>\n<p><a
