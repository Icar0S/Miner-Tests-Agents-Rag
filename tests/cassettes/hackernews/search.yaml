        HN, this will likely interest you if you''re a) into dense data visualization
        or b) trying to figure out how to measure the quality of a retrieval-augmented
        generation (<em>RAG</em>) system.<p>There''s an OSS tool called Open <em>RAG</em>
        Eval that analyzes <em>RAG</em>-based query-and-answer sets to generate a
        dense set of metrics in an &quot;<em>evaluation</em> report&quot;. This report
        is in CSV format and the data is basically impossible for a human to read
        because there''s so much of it.<p>I built Open <em>Evaluation</em> to enable
        folks to load in a report and visualize the <em>evaluation</em> metrics in
        a more human-readable way. The challenge was the sheer amount of information
        to visualize. I went with a collapsible table with sticky headers to presenting
        the info, so you can compare metrics across reports and questions. I also
        tried to make everything clickable, so if you want to understand the meaning
        behind a metric you can just click it to open up an info panel to learn more
        about it.<p>The site has built-in sample <em>evaluation</em> reports, so you
        can try it out without needing to generate your own reports. If you give it
        a shot please share your feedback. I''d love to find ways to make this more
        usable.<p>Full disclosure: I did this for work and my coworkers also made
        Open <em>RAG</em> Eval."},"title":{"fullyHighlighted":false,"matchLevel":"partial","matchedWords":["evaluation"],"value":"Show
        HN: Open <em>Evaluation</em>"},"url":{"matchLevel":"none","matchedWords":[],"value":"https://openevaluation.ai/"}},"_tags":["story","author_cjcenizal","story_44043483","show_hn"],"author":"cjcenizal","created_at":"2025-05-20T16:40:19Z","created_at_i":1747759219,"num_comments":0,"objectID":"44043483","points":3,"story_id":44043483,"story_text":"Hey
        HN, this will likely interest you if you&#x27;re a) into dense data visualization
        or b) trying to figure out how to measure the quality of a retrieval-augmented
        generation (RAG) system.<p>There&#x27;s an OSS tool called Open RAG Eval that
        analyzes RAG-based query-and-answer sets to generate a dense set of metrics
        in an &quot;evaluation report&quot;. This report is in CSV format and the
        data is basically impossible for a human to read because there&#x27;s so much
        of it.<p>I built Open Evaluation to enable folks to load in a report and visualize
        the evaluation metrics in a more human-readable way. The challenge was the
        sheer amount of information to visualize. I went with a collapsible table
        with sticky headers to presenting the info, so you can compare metrics across
        reports and questions. I also tried to make everything clickable, so if you
        want to understand the meaning behind a metric you can just click it to open
        up an info panel to learn more about it.<p>The site has built-in sample evaluation
        reports, so you can try it out without needing to generate your own reports.
        If you give it a shot please share your feedback. I&#x27;d love to find ways
        to make this more usable.<p>Full disclosure: I did this for work and my coworkers
        also made Open RAG Eval.","title":"Show HN: Open Evaluation","updated_at":"2025-09-14T10:41:39Z","url":"https://openevaluation.ai/"},{"_highlightResult":{"author":{"matchLevel":"none","matchedWords":[],"value":"nidhishbhavsar"},"story_text":{"fullyHighlighted":false,"matchLevel":"full","matchedWords":["rag","evaluation"],"value":"Hey
        HN,<p>I''m Nidhish, a solopreneur who left the 9-to-5 grind to build products
        full-time.<p>Noticing that many are creating AI chatbots using basic Retrieval-Augmented
        Generation (<em>RAG</em>) techniques, I saw an opportunity to enhance answer
        quality with advanced methods.<p>So, I developed Chatsguru, which employs
        advanced <em>RAG</em> strategies like semantic chunking, Cohere re-ranking,
        and LangGraph <em>evaluation</em> to deliver superior AI responses.<p>With
        Chatsguru, you can create and embed a chatbot into your website without any
        coding. Additionally, it offers answer monitoring and fine-tuning directly
