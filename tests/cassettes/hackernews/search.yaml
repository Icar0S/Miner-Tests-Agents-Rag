        \u2013 Lightweight hallucination detector for RAG pipelines","updated_at":"2025-04-22T17:23:34Z","url":"https://github.com/KRLabsOrg/LettuceDetect"},{"_highlightResult":{"author":{"matchLevel":"none","matchedWords":[],"value":"jeffreyip"},"story_text":{"fullyHighlighted":false,"matchLevel":"full","matchedWords":["rag","evaluation"],"value":"Hi
        HN - we''re Jeffrey and Kritin, and we''re building Confident AI (<a href=\"https://confident-ai.com\">https://confident-ai.com</a>).
        This is the cloud platform for DeepEval (<a href=\"https://github.com/confident-ai/deepeval\">https://github.com/confident-ai/deepeval</a>),
        our open-source package that helps engineers evaluate and unit-test LLM applications.
        Think Pytest for LLMs.<p>We spent the past year building DeepEval with the
        goal of providing the best LLM <em>evaluation</em> developer experience, growing
        it to run over 600K evaluations daily in CI/CD pipelines of enterprises like
        BCG, AstraZeneca, AXA, and Capgemini. But the fact that DeepEval simply runs,
        and does nothing with the data afterward, isn\u2019t the best experience.
        If you want to inspect failing test cases, identify regressions, or even pick
        the best model/prompt combination, you need more than just DeepEval. That\u2019s
        why we built a platform around it.<p>Here\u2019s a quick demo video of how
        everything works: <a href=\"https://youtu.be/PB3ngq7x4ko\" rel=\"nofollow\">https://youtu.be/PB3ngq7x4ko</a><p>Confident
        AI is great for <em>RAG</em> pipelines, agents, and chatbots. Typical use
        cases involve allowing companies to switch the underlying LLM, rewrite prompts
        for newer (and possibly cheaper) models, and keep test sets in sync with the
        codebase where DeepEval tests are run.<p>Our platform features a &quot;dataset
        editor,&quot; a &quot;regression catcher,&quot; and &quot;iteration insights&quot;.
        The datasets editor in Confident AI allows domain experts to edit datasets
        while keeping them in sync with your codebase for <em>evaluation</em>. We\u2019ll
        then generate sharable LLM testing/benchmark reports once DeepEval has finished
        running evaluations on these datasets that are pulled from the cloud. The
        regression catcher then identifies any regressions in your new implementation,
        and we use these <em>evaluation</em> results to determine the best iteration
        based on your metric scores.<p>Our goal is to make benchmarking LLM applications
        so reliable that picking the best implementation is as simple as reading the
        metric values off the dashboard. To achieve this, the quality of curated datasets
        and the accuracy and reliability of metrics must be the highest possible.<p>This
        brings us to our current limitations. Right now, DeepEval\u2019s primary <em>evaluation</em>
        method is LLM-as-a-judge. We use techniques such as GEval and question-answer
        generation to improve reliability, but these methods can still be inconsistent.
        Even with high-quality datasets curated by domain experts, our <em>evaluation</em>
        metrics remain the biggest blocker to our goal.<p>To address this, we recently
        released a DAG (Directed Acyclic Graph) metric in DeepEval. It is a decision-tree-based,
        LLM-as-a-judge metric that provides deterministic results by breaking a test
        case into finer atomic units. Each edge represents a decision, each node represents
        an LLM <em>evaluation</em> step, and each leaf node returns a score. It works
        best in scenarios where success criteria are clearly defined, such as text
        summarization.<p>The DAG metric is still in its early stages, but our hope
        is that by moving towards better, code-driven, open-source metrics, Confident
        AI can deliver deterministic LLM benchmarks that anyone can blindly trust.<p>We
        hope you\u2019ll give Confident AI a try. Quickstart here: <a href=\"https://docs.confident-ai.com/confident-ai/confident-ai-introduction\">https://docs.confident-ai.com/confident-ai/confident-ai-intr...</a><p>The
        platform runs on a freemium tier, and we''ve dropped the need to signup with
        a work email for the next four days.<p>Looking forward to your thoughts!"},"title":{"fullyHighlighted":false,"matchLevel":"partial","matchedWords":["evaluation"],"value":"Launch
