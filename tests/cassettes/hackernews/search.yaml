        HN, I spent my xmas break building an agent framework called mcp-agent [1](<a
        href=\"https://github.com/lastmile-ai/mcp-agent\">https://github.com/lastmile-ai/mcp-agent</a>)
        for Model Context Protocol [2]. It makes it easy to build AI apps with MCP
        servers, and implements every pattern from the popular Building Effective
        Agents blog [3] as well as OpenAI\u2019s Swarm [4]. I\u2019m sharing it early
        to get community feedback on where to take it from here, and to ask for contributions.<p>For
        those who aren\u2019t familiar with MCP, I think of it as a standardized interface
        to let AI communicate with software via tool calls, resources and prompts.<p>mcp-agent
        provides a higher level interface to build apps with MCP. It handles the connection
        management of MCP servers so you don\u2019t have to. It also implements the
        Building Effective Agents patterns:\n- Augmented LLM (an LLM with access to
        one or more MCP servers)\n- Router, Orchestrator-Worker, <em>Evaluator</em>-Optimizer,
        and more\n- Swarm<p>The key design principles are composability and reusability
        \u2013 every pattern is an AugmentedLLM itself, so you can chain them into
        more complex workflows.<p>Some background: I worked on LSP [5] and language
        servers at Microsoft, and saw firsthand how standards and protocols can revolutionize
        developer workflows. Before LSP every IDE had its own esoteric ways of providing
        language services. LSP changed all that, and arguably made every language
        server better, since they can focus on improving a single implementation for
        all clients.<p>I think AI development is in a similar pre-LSP space right
        now. There are tons of frameworks [6], every model provider has its own way
        of handling messages, tool calls, streaming, etc. I really think we need a
        protocol to standardize these patterns.<p>Pretty soon every service is going
        to expose an MCP interface, and mcp-agent is about letting developers orchestrate
        these services into applications (i.e. build \u201cMCP apps\u201d). This can
        cover any use of an AI model that needs to interact with the world around
        it:\n- <em>RAG</em> pipelines and Q&amp;A chatbots\n- Process automation via
        AI workflows/async tasks\n- Multi-agent orchestration, with human in the loop<p>The
        repo contains examples [7] to build <em>RAG</em> agents, streamlit apps and
        more. There\u2019s a lot left to build, like streaming support, server auth
        and tighter integration with MCP clients.<p>But I wanted to share early in
        the hopes that you can guide me:\n- If you find this useful, please let me
        know. If it\u2019s useful to you, I will dedicate all my time to improving
        it.\n- I really welcome contributions. If you want to collaborate, please
        reach out on github to help take this forward.<p>I want to help standardize
        AI development, so developers a few years from now can look back with horror
        at the pre-MCP days.<p>[1] - <a href=\"https://github.com/lastmile-ai/mcp-agent\">https://github.com/lastmile-ai/mcp-agent</a><p>[2]
        - <a href=\"https://modelcontextprotocol.io/introduction\" rel=\"nofollow\">https://modelcontextprotocol.io/introduction</a><p>[3]
        - <a href=\"https://www.anthropic.com/research/building-effective-agents\"
        rel=\"nofollow\">https://www.anthropic.com/research/building-effective-agents</a><p>[4]
        - <a href=\"https://github.com/openai/swarm\">https://github.com/openai/swarm</a><p>[5]
        - <a href=\"https://microsoft.github.io/language-server-protocol/\" rel=\"nofollow\">https://microsoft.github.io/language-server-protocol/</a><p>[6]
        - <a href=\"https://xkcd.com/927/\" rel=\"nofollow\">https://xkcd.com/927/</a>
        (I understand the irony)<p>[7] - <a href=\"https://github.com/lastmile-ai/mcp-agent/tree/main/examples\">https://github.com/lastmile-ai/mcp-agent/tree/main/examples</a>"},"title":{"matchLevel":"none","matchedWords":[],"value":"Show
