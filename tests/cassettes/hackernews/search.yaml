        An evaluation dataset for both web-browsing agents and RAG systems","updated_at":"2025-06-18T14:46:16Z","url":"https://huggingface.co/datasets/teilomillet/wikipeqa"},{"_highlightResult":{"author":{"matchLevel":"none","matchedWords":[],"value":"throwawaystress"},"story_text":{"fullyHighlighted":false,"matchLevel":"full","matchedWords":["rag","evaluation"],"value":"How
        are you organizing your data for your <em>RAG</em> applications? I''ve searched
        all over and have found tons of tutorials about how the tech stack works,
        but very little about how the data is actually stored. I don''t want to just
        create an application that can give an answer, I want something I can use
        to evaluate my progress as I improve my prompts and retrievals.<p>This is
        the kind of stuff that I think needs to be stored:\n- Prompt templates (i.e.,
        versioning my prompts)\n- Final inputs to and outputs from the LLM provider
        (and associated metadata)\n- Chunks of all my documents to be used in <em>RAG</em>\n-
        The chunks that were retrieved for a given prompt, so that I can evaluate
        the performance of the retrieval step\n- Conversations (or chains?) for when
        there might be multiple requests sent to an LLM for a given &quot;question&quot;\n-
        Experiments. This is for the purposes of <em>evaluation</em>. It would associate
        an experiment ID with a series of inputs/outputs for an <em>evaluation</em>
        set of questions.<p>I can''t be the first person to hit this issue. I started
        off with a simple SQLite database with a handful of tables, and now that I''m
        going to be incorporating <em>RAG</em> into the application (and probably
        agentic stuff soon), I really want to leverage someone else''s learning so
        I don''t rediscover all the same mistakes."},"title":{"fullyHighlighted":false,"matchLevel":"partial","matchedWords":["rag"],"value":"Ask
        HN: What data model are you using for <em>RAG</em> prototyping?"}},"_tags":["story","author_throwawaystress","story_42607157","ask_hn"],"author":"throwawaystress","created_at":"2025-01-06T02:56:27Z","created_at_i":1736132187,"num_comments":0,"objectID":"42607157","points":1,"story_id":42607157,"story_text":"How
        are you organizing your data for your RAG applications? I&#x27;ve searched
        all over and have found tons of tutorials about how the tech stack works,
        but very little about how the data is actually stored. I don&#x27;t want to
        just create an application that can give an answer, I want something I can
        use to evaluate my progress as I improve my prompts and retrievals.<p>This
        is the kind of stuff that I think needs to be stored:\n- Prompt templates
        (i.e., versioning my prompts)\n- Final inputs to and outputs from the LLM
        provider (and associated metadata)\n- Chunks of all my documents to be used
        in RAG\n- The chunks that were retrieved for a given prompt, so that I can
        evaluate the performance of the retrieval step\n- Conversations (or chains?)
        for when there might be multiple requests sent to an LLM for a given &quot;question&quot;\n-
        Experiments. This is for the purposes of evaluation. It would associate an
        experiment ID with a series of inputs&#x2F;outputs for an evaluation set of
        questions.<p>I can&#x27;t be the first person to hit this issue. I started
        off with a simple SQLite database with a handful of tables, and now that I&#x27;m
        going to be incorporating RAG into the application (and probably agentic stuff
        soon), I really want to leverage someone else&#x27;s learning so I don&#x27;t
        rediscover all the same mistakes.","title":"Ask HN: What data model are you
        using for RAG prototyping?","updated_at":"2025-01-06T03:01:07Z"},{"_highlightResult":{"author":{"matchLevel":"none","matchedWords":[],"value":"fatihbaltaci"},"story_text":{"fullyHighlighted":false,"matchLevel":"full","matchedWords":["rag","evaluation"],"value":"Hey
        everyone,<p>A couple of months ago, we created Gurubase.io to build <em>RAG</em>-based
