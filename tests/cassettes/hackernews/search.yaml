        (<em>RAG</em>) systems, especially in complex domains like medical or legal.<p>Most
        existing hallucination detectors rely on full LLM inference (expensive, slow),
        or struggle with long-context inputs.<p>I built LettuceDetect \u2014 an open-source,
        encoder-only framework that detects hallucinated spans in LLM-generated answers
        based on the retrieved context. No LLMs needed, and it much more efficiently.<p>Highlights:<p>-
