        apps","updated_at":"2026-06-14T02:35:39Z"},{"_highlightResult":{"author":{"matchLevel":"none","matchedWords":[],"value":"vasa_"},"story_text":{"fullyHighlighted":false,"matchLevel":"full","matchedWords":["rag","evaluation"],"value":"Hey
        there HN! We\u2019re Vasilije, Boris, and Laszlo, and we\u2019re excited to
        introduce cognee, an open-source Python library that approaches building evolving
        semantic memory using knowledge graphs + data pipelines<p>Before we built
        cognee, Vasilije(B Economics and Clinical Psychology) worked at a few unicorns
        (Omio, Zalando, Taxfix), while Boris managed large-scale applications in production
        at Pera and StuDocu. Laszlo joined after getting his PhD in Graph Theory at
        the University of Szeged.<p>Using LLMs to connect to large datasets (<em>RAG</em>)
        has been popularized and has shown great promise. Unfortunately, this approach
        doesn\u2019t live up to the hype.<p>Let\u2019s assume we want to load a large
        repository from GitHub to a vector store.\nConnectingfiles in larger systems
        with <em>RAG</em> would fail because a fixed <em>RAG</em> limit is too constraining
        in longer dependency chains. While we need results that are aware of the context
        of the whole repository, <em>RAG</em>\u2019s similarity-based retrieval does
        not capture the full context of interdependent files spread across the repository.<p>This
        approach allows cognee to retrieve all relevant and correct context at inference
        time. For example, if `function A` in one file calls `function B` in another
        file, which calls `function C` in a third file, all code and summaries that
        further explain their position and purpose in that chain are served as context.
        As a result, the system has complete visibility into how different code parts
        work together within the repo.<p>Last year, Microsoft took a leap published
        GraphRAG - i.e. <em>RAG</em> with Knowledge Graphs. We think it is the right
        direction.\nOur initial ideas were similar to this paper and this got some
        attention on Twitter (<a href=\"https://x.com/tricalt/status/1722216426709365024\"
        rel=\"nofollow\">https://x.com/tricalt/status/1722216426709365024</a>)<p>Over
        time we understood we needed tooling to create dynamically evolving groups
        of graphs, cross-connected and evaluated together.\nOur tool is named after
        a process called cognification. We prefer the definition that Vakalo (1978)
        uses to explain that cognify represents &quot;building a fitting (mental)
        picture&quot;<p>We believe that agents of tomorrow will require a correct
        dynamic \u201cmental picture\u201d or context to operate in a rapidly evolving
        landscape.<p>To address this, we built ECL pipelines, where we do the following:\n-
        Extract data from various sources using dlt and existing frameworks\n- Cognify
        - create a graph/vector representation of the data\n- Load - store the data
        in the vector (in this case our partner FalkorDB), graph, and relational stores<p>We
        can also continuously feed the graph with new information, and when testing
        this approach we found that on HotpotQA, with human labeling, we achieved
        87% answer accuracy (<a href=\"https://docs.cognee.ai/evaluations\" rel=\"nofollow\">https://docs.cognee.ai/<em>evaluations</em></a>).<p>To
        show how the approach works we did an integration with continue.dev and built
        a codegraph<p>Here is how codegraph was implemented: \nWe''re explicitly including
        repository structure details and integrating custom dependency graph versions.
        Think of it as a more insightful way to understand your codebase''s architecture.\nBy
        transforming dependency graphs into knowledge graphs, we''re creating a quick,
        graph-based version of tools like tree-sitter. This means faster and more
        accurate code analysis.\nWe worked on modeling causal relationships within
        code and enriching them with LLMs. This helps you understand how different
        parts of your code influence each other.\nWe created graph skeletons in memory
        which allows us to perform various operations on graphs and power custom retrievers.<p>If
        you want to integrate cognee into your systems or have a look at codegraph,
        our GitHub repository is (<a href=\"https://github.com/topoteretes/cognee\">https://github.com/topoteretes/cognee</a>)<p>Thank
        you for reading! We\u2019re definitely early and welcome your ideas and experiences
        as it relates to agents, graphs, evals, and human+LLM memory."},"title":{"fullyHighlighted":false,"matchLevel":"partial","matchedWords":["rag"],"value":"Show
        HN: Cognee \u2013 Turn <em>RAG</em> and GraphRAG into custom dynamic semantic
        memory"},"url":{"matchLevel":"none","matchedWords":[],"value":"https://github.com/topoteretes/cognee"}},"_tags":["story","author_vasa_","story_43031915","show_hn"],"author":"vasa_","children":[43034688],"created_at":"2025-02-13T01:59:26Z","created_at_i":1739411966,"num_comments":1,"objectID":"43031915","points":6,"story_id":43031915,"story_text":"Hey
        there HN! We\u2019re Vasilije, Boris, and Laszlo, and we\u2019re excited to
        introduce cognee, an open-source Python library that approaches building evolving
        semantic memory using knowledge graphs + data pipelines<p>Before we built
        cognee, Vasilije(B Economics and Clinical Psychology) worked at a few unicorns
        (Omio, Zalando, Taxfix), while Boris managed large-scale applications in production
        at Pera and StuDocu. Laszlo joined after getting his PhD in Graph Theory at
        the University of Szeged.<p>Using LLMs to connect to large datasets (RAG)
        has been popularized and has shown great promise. Unfortunately, this approach
        doesn\u2019t live up to the hype.<p>Let\u2019s assume we want to load a large
        repository from GitHub to a vector store.\nConnectingfiles in larger systems
        with RAG would fail because a fixed RAG limit is too constraining in longer
        dependency chains. While we need results that are aware of the context of
        the whole repository, RAG\u2019s similarity-based retrieval does not capture
        the full context of interdependent files spread across the repository.<p>This
        approach allows cognee to retrieve all relevant and correct context at inference
        time. For example, if `function A` in one file calls `function B` in another
        file, which calls `function C` in a third file, all code and summaries that
        further explain their position and purpose in that chain are served as context.
        As a result, the system has complete visibility into how different code parts
        work together within the repo.<p>Last year, Microsoft took a leap published
        GraphRAG - i.e. RAG with Knowledge Graphs. We think it is the right direction.\nOur
        initial ideas were similar to this paper and this got some attention on Twitter
        (<a href=\"https:&#x2F;&#x2F;x.com&#x2F;tricalt&#x2F;status&#x2F;1722216426709365024\"
        rel=\"nofollow\">https:&#x2F;&#x2F;x.com&#x2F;tricalt&#x2F;status&#x2F;1722216426709365024</a>)<p>Over
        time we understood we needed tooling to create dynamically evolving groups
        of graphs, cross-connected and evaluated together.\nOur tool is named after
        a process called cognification. We prefer the definition that Vakalo (1978)
        uses to explain that cognify represents &quot;building a fitting (mental)
        picture&quot;<p>We believe that agents of tomorrow will require a correct
        dynamic \u201cmental picture\u201d or context to operate in a rapidly evolving
        landscape.<p>To address this, we built ECL pipelines, where we do the following:\n-
        Extract data from various sources using dlt and existing frameworks\n- Cognify
        - create a graph&#x2F;vector representation of the data\n- Load - store the
        data in the vector (in this case our partner FalkorDB), graph, and relational
        stores<p>We can also continuously feed the graph with new information, and
        when testing this approach we found that on HotpotQA, with human labeling,
        we achieved 87% answer accuracy (<a href=\"https:&#x2F;&#x2F;docs.cognee.ai&#x2F;evaluations\"
        rel=\"nofollow\">https:&#x2F;&#x2F;docs.cognee.ai&#x2F;evaluations</a>).<p>To
        show how the approach works we did an integration with continue.dev and built
        a codegraph<p>Here is how codegraph was implemented: \nWe&#x27;re explicitly
        including repository structure details and integrating custom dependency graph
        versions. Think of it as a more insightful way to understand your codebase&#x27;s
        architecture.\nBy transforming dependency graphs into knowledge graphs, we&#x27;re
        creating a quick, graph-based version of tools like tree-sitter. This means
        faster and more accurate code analysis.\nWe worked on modeling causal relationships
        within code and enriching them with LLMs. This helps you understand how different
        parts of your code influence each other.\nWe created graph skeletons in memory
        which allows us to perform various operations on graphs and power custom retrievers.<p>If
        you want to integrate cognee into your systems or have a look at codegraph,
        our GitHub repository is (<a href=\"https:&#x2F;&#x2F;github.com&#x2F;topoteretes&#x2F;cognee\">https:&#x2F;&#x2F;github.com&#x2F;topoteretes&#x2F;cognee</a>)<p>Thank
        you for reading! We\u2019re definitely early and welcome your ideas and experiences
        as it relates to agents, graphs, evals, and human+LLM memory.","title":"Show
        HN: Cognee \u2013 Turn RAG and GraphRAG into custom dynamic semantic memory","updated_at":"2026-06-26T19:29:14Z","url":"https://github.com/topoteretes/cognee"},{"_highlightResult":{"author":{"matchLevel":"none","matchedWords":[],"value":"laminarflow027"},"story_text":{"fullyHighlighted":false,"matchLevel":"full","matchedWords":["rag","evaluation"],"value":"In
        this post, we document the results of some experiments comparing vanilla Graph
        <em>RAG</em> (just a single pass of text2cypher) vs. a router agent Graph
        <em>RAG</em> approach that can call vector search tools alongside text2cypher.
        The routing agent uses an LLM to decide which vector search tool to call,
        depending on the terms identified in the question, and it works quite well.<p>The
        results show that recent frontier LLMs like `gpt-4.1` and the trusty workhorse
        `gemini-2.0-flash` produce great quality Cypher reliably and reproducibly,
        with some prompt engineering to ensure that the graph schema is formatted
        well in the text2cypher prompt. Across a suite of 10 test queries (that are
        moderately complex and require paths to be retrieved from the knowledge graph),
        `gpt-4.1` and `gemini-2.0-flash` pass all tests, generating the right answers
        when a router agent is added to the workflow to enhance vanilla Graph <em>RAG</em>.<p>Prompt
        engineering is done using BAML (a programming language that makes it simple
        to prompt LLMs and get structured outputs from them in all experiments. In
        fact, the knowledge graph itself was constructed using BAML prompts that extract
        entities and relationships from unstructured data upstream.<p>A logical next
        step to this workflow is to build more complex agent loops that can run multi-step
        Cypher queries whose results can be consolidated to answer harder questions
        (similar to how a human would approach it). The general principles of testing
        and <em>evaluation</em> would apply here, too. Seems promising to explore
        these methods further!"},"title":{"fullyHighlighted":false,"matchLevel":"partial","matchedWords":["rag"],"value":"Show
        HN: Towards agentic Graph <em>RAG</em>: Enhancing graph retrieval with vector
